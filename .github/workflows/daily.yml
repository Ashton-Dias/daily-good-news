name: Daily story

on:
  schedule:
    - cron: "0 4 * * *"   # 04:00 UTC daily; the widget reloads at 6am local
  workflow_dispatch:

concurrency:
  group: daily-story
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - run: python pipeline/main.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
      - name: Commit new story
        run: |
          git config user.name "daily-good-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Publish story for $(date -u +%F)"
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
