name: DailyGoodNews
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Config.xcconfig
  Release: Config/Config.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  DailyGoodNews:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - target: DailyGoodNewsWidget
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Daily Good News
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLName: $(APP_BUNDLE_ID)
            CFBundleURLSchemes: [dailygoodnews]
        GoodNewsBaseURL: $(JSON_BASE_URL)
        AppGroupID: $(APP_GROUP_ID)
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: App/DailyGoodNews.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
  DailyGoodNewsWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Daily Good News
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        GoodNewsBaseURL: $(JSON_BASE_URL)
        AppGroupID: $(APP_GROUP_ID)
    entitlements:
      path: Widget/DailyGoodNewsWidget.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).widget
        TARGETED_DEVICE_FAMILY: "1"
